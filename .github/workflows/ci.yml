name: CI Pipeline

on:
  push:
    branches:
      - main
      - task-1
      - task-2

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run linter
        run: flake8 src/ tests/ --max-line-length=88 --ignore=E501
      - name: Run tests
        run: pytest tests/